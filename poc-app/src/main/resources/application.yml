spring:
  application:
    name: poc
  profiles:
    default: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    schemas:
      - poc_user
      - poc_notification
    create-schemas: true
    locations: classpath:db/migration
    ignore-migration-patterns: "*:*"

server:
  port: 8080

logging:
  level:
    com.poc: DEBUG
    org.springframework.boot: INFO
    org.springframework.cloud.vault: DEBUG
