spring:
  application:
    name: poc
  profiles:
    default: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    validate-on-migrate: true
    out-of-order: false
    schemas:
      - poc_user
      - poc_notification
      - poc_outbox
      - poc_dlq
    create-schemas: true
    locations: classpath:db/migration
    ignore-migration-patterns: "*:*"
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8080

app:
  datasource:
    primary:
      hikari:
        jdbc-url: jdbc:postgresql://localhost:6432/poc
        driver-class-name: org.postgresql.Driver
        username: poc
        password: poc
        maximum-pool-size: 10
        minimum-idle: 2
        pool-name: primary-pool
    replica:
      hikari:
        jdbc-url: jdbc:postgresql://localhost:6433/poc
        driver-class-name: org.postgresql.Driver
        username: poc
        password: poc
        maximum-pool-size: 10
        minimum-idle: 2
        pool-name: replica-pool

topics:
  email: poc.dev.email.events.v1
  dlq:
    email: poc.dev.email.dlq.v1
    pattern: "poc\\.dev\\..*\\.dlq\\..*"

outbox:
  poll-interval-ms: 500
  batch-size: 50
  max-retries: 5

logging:
  level:
    com.poc: DEBUG
    org.springframework.boot: INFO
    org.springframework.cloud.vault: DEBUG
    # Uncomment to verify read/write routing (shows which pool handles each request)
    # com.zaxxer.hikari: DEBUG
    # com.poc.app.config.datasource: DEBUG
