spring:
  config:
    import: vault://
  cloud:
    vault:
      host: localhost
      port: 8200
      scheme: http
      authentication: TOKEN
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: secret
        default-context: poc
        api-version: 2

app:
  datasource:
    primary:
      hikari:
        jdbc-url: jdbc:postgresql://localhost:6432/poc
        driver-class-name: org.postgresql.Driver
        username: poc
        password: poc
        maximum-pool-size: 10
        minimum-idle: 2
        pool-name: primary-pool
    replica:
      hikari:
        jdbc-url: jdbc:postgresql://localhost:6433/poc
        driver-class-name: org.postgresql.Driver
        username: poc
        password: poc
        maximum-pool-size: 10
        minimum-idle: 2
        pool-name: replica-pool

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

keycloak:
  auth-server-url: http://localhost:8081
